template: fox-ess-h3-smart
products:
  - brand: FoxESS
    description:
      generic: H3-Pro/Smart Series Hybrid Inverter
capabilities: ["battery-control"]
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: modbus
    choice: ["rs485", "tcpip"]
    id: 247
  - name: maxacpower
  - preset: battery-params
  - name: maxchargepower
    required: true
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: calc
    add:
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 38816 # Meter Power R
        type: holding
        decode: int32
      scale: -0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 38818 # Meter Power S
        type: holding
        decode: int32
      scale: -0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 38820 # Meter Power T
        type: holding
        decode: int32
      scale: -0.1
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 39617 # Grid Consumption Total
      type: holding
      decode: uint32
    scale: 0.01
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: calc
    add:
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 39279 # PV1
        type: holding
        decode: int32
      block: # 39279-39290
        register: 39279
        count: 12
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 39281 # PV2
        type: holding
        decode: int32
      block: # 39279-39290
        register: 39279
        count: 12
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 39283 # PV3
        type: holding
        decode: int32
      block: # 39279-39290
        register: 39279
        count: 12
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 39285 # PV4
        type: holding
        decode: int32
      block: # 39279-39290
        register: 39279
        count: 12
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 39287 # PV5
        type: holding
        decode: int32
      block: # 39279-39290
        register: 39279
        count: 12
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 39289 # PV6
        type: holding
        decode: int32
      block: # 39279-39290
        register: 39279
        count: 12
  maxacpower: {{ .maxacpower }}
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 39237 # Battery Charge/Discharge
      type: holding
      decode: int32
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 37612 # Soc
      type: holding
      decode: int16
  batterymode:
    source: switch
    switch:
    - case: 1 # normal - Self Use, restore SoC limits and discharge
      set:
        source: sequence
        set:
        # Set global Work Mode = Self Use (max 1/2 per protocol)
        - source: const
          value: 1
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 49203 # Work Mode
              type: writesingle
              encoding: uint16
        # Disable Group 24 (evcc control channel)
        - source: const
          value: 0
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 48240 # Group 24 Enable
              type: writesingle
              encoding: uint16
        # Disable Time Period System (keeps app schedules' registers intact)
        - source: const
          value: 0
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 48000 # Time Mode Flag
              type: writesingle
              encoding: uint16
        # Restore MaxSoC FromGrid
        - source: const
          value: {{ .maxsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 46620 # MaxSoC FromGrid
              type: writesingle
              encoding: uint16
        # Restore battery discharge current (50A)
        - source: const
          value: 500
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 46608 # Battery max discharge current
              type: writesingle
              encoding: uint16
    - case: 2 # hold - prevent battery discharge
      set:
        source: sequence
        set:
        # Set global Work Mode = Self Use (max 1/2 per protocol)
        - source: const
          value: 1
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 49203 # Work Mode
              type: writesingle
              encoding: uint16
        # Disable Group 24 (evcc control channel)
        - source: const
          value: 0
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 48240 # Group 24 Enable
              type: writesingle
              encoding: uint16
        # Disable Time Period System (keeps app schedules' registers intact)
        - source: const
          value: 0
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 48000 # Time Mode Flag
              type: writesingle
              encoding: uint16
        # MaxSoC FromGrid = 100% (full grid-charging range)
        - source: const
          value: 100
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 46620 # MaxSoC FromGrid
              type: writesingle
              encoding: uint16
        # Lock battery discharge (0A)
        - source: const
          value: 0
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 46608 # Battery max discharge current
              type: writesingle
              encoding: uint16
    - case: 3 # charge - force charge from grid via Time Period Group 24
      set:
        source: sequence
        set:
        # Time Period System master flag stays 1 (never globally disabled)
        - source: const
          value: 1
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 48000 # Time Mode Flag
              type: writesingle
              encoding: uint16
        # Group 24 Enable
        - source: const
          value: 1
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 48240 # Group 24 Enable
              type: writesingle
              encoding: uint16
        # Start Time 00:00
        - source: const
          value: 0
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 48241 # Group 24 Start Time
              type: writesingle
              encoding: uint16
        # End Time 23:59 (0x173B = 5947)
        - source: const
          value: 5947
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 48242 # Group 24 End Time
              type: writesingle
              encoding: uint16
        # Work Mode = Force Charge
        - source: const
          value: 6
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 48243 # Group 24 Work Mode
              type: writesingle
              encoding: uint16
        # MaxSoC/ MinSoC combined register
        - source: const
          value: {{ add (mul .maxsoc 256) .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 48244 # Group 24 MaxSoC<<8 | MinSoC
              type: writesingle
              encoding: uint16
        # FDSOC
        - source: const
          value: {{ .maxsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 48245 # Group 24 FDSOC
              type: writesingle
              encoding: uint16
        # FDPWR - force charge power in Watts
        - source: const
          value: {{ .maxchargepower }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 48246 # Group 24 FDPWR
              type: writesingle
              encoding: uint16
        # Reserve
        - source: const
          value: 0
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 48247 # Group 24 Reserve
              type: writesingle
              encoding: uint16
        # Reserve
        - source: const
          value: 0
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 48248 # Group 24 Reserve
              type: writesingle
              encoding: uint16
        # Enable Flag (undocumented, required for force charge)
        - source: const
          value: 1
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 48249 # Group 24 Enable Flag
              type: writesingle
              encoding: uint16
    default:
      source: error
      error: ErrNotAvailable
  {{- include "battery-params" . }}
  {{- end }}
